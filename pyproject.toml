[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lipidimea"
dynamic = ["version"]
requires-python = ">=3.12"

[tool.setuptools.dynamic]
version = {attr = "lipidimea.__version__"}

[tool.setuptools.package-data]
lipidimea = [
    "_include/**"
]